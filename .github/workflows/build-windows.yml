name: Build TIREX CHEATS for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TIREX_CHEATS app.py
      - uses: actions/upload-artifact@v4
        with:
          name: TIREX-CHEATS-Windows
          path: dist/TIREX_CHEATS.exe
